# Builds the site and publishes it to GitHub Pages on every push to main.
# GitHub Pages needs a public repo on a free plan, so both jobs are skipped
# while the repo is private; they start working as soon as it's made public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Astro 7 needs Node 22.23+; match the local Node 24
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
